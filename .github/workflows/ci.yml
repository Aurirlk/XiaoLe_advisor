name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite (excludes LLM API tests)
        env:
          # 不注入任何 LLM Key —— pytest.ini 默认 `-m "not llm"` 排除真调用
          APP_ENV: test
        run: pytest

      - name: Guard: 单一 graph_builder.py 真源（防重复代码树回归，P1-20）
        run: |
          COUNT=$(find . -name "graph_builder.py" -not -path "./.git/*" | wc -l)
          test "$COUNT" -eq 1 || (echo "发现 $COUNT 份 graph_builder.py，重复代码树回归！" && exit 1)

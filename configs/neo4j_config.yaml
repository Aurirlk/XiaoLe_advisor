# Neo4j 知识图谱配置
# 部署方式: Docker部署
# 启动命令: docker run -d --name neo4j -p 7474:7474 -p 7687:7687 -e NEO4J_AUTH=neo4j/<你的密码> neo4j:5.15-community
# 密码通过环境变量 NEO4J_PASSWORD 注入，切勿在此文件写明文密码

neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "${NEO4J_PASSWORD}"
  database: "neo4j"
  max_connection_lifetime: 3600
  max_connection_pool_size: 50
